<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the space's routes and fails auth. -->
    <link rel="icon" href="data:," />
    <title>ViceSunshine — Unofficial GTA VI Fan Community</title>
    <meta
      name="description"
      content="ViceSunshine is an unofficial fan community for Grand Theft Auto VI players — news, patch tracker, bug reports, crews, LFG and events. Not affiliated with Rockstar Games or Take-Two Interactive."
    />
    <!-- Google AdSense site verification (publisher pub-7992809900355487,
         account officialvicesunshine@gmail.com, added Nov 23 2026): the
         meta tag and the adsbygoogle.js snippet below are two of the
         three verification methods Google offers (the third is ads.txt).
         Either one lets Google confirm vicesunshine.com belongs to this
         AdSense account. Keep both in place during the site review and
         after approval — removing them can drop the verification. -->
    <meta name="google-adsense-account" content="ca-pub-7992809900355487" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7992809900355487" crossorigin="anonymous"></script>
    <!-- Google Analytics 4 (property for vicesunshine.com, Measurement ID
         G-6WXQ8S0VS6, added Nov 24 2026): invisible visitor counting only —
         no visible element, no change to how the site looks or works. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6WXQ8S0VS6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6WXQ8S0VS6');
    </script>
    <script src="./src/main.tsx" type="module"></script>
    <!-- Critical first-paint styles: the boot message below must be readable
         immediately, before the CSS bundle arrives, so a slow or blocked
         load never looks like a blank blue screen. -->
    <style>
      body { background: #0b0b14; margin: 0; }
      .boot-msg {
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px;
        text-align: center;
        color: #f4f1ea;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .boot-msg .boot-name { font-size: 26px; font-weight: 800; letter-spacing: 0.02em; }
      .boot-msg .boot-name span { color: #ff2e88; }
      .boot-msg p { margin: 0; color: #9b97ad; line-height: 1.5; max-width: 340px; }
    </style>
  </head>
  <body>
    <div
      data-generated-space-root=""
      data-generated-space-slug="leonida-hub"
    >
      <!-- Boot placeholder: React replaces this on mount. If the script
           bundle never loads, the user still sees this message instead of
           an empty dark screen. -->
      <div class="boot-msg" role="status">
        <div class="boot-name">Vice<span>Verse</span></div>
        <p>Loading the hub…</p>
        <p>
          If this screen doesn’t change after a few seconds, part of the page
          couldn’t load — check your connection, then close and reopen
          ViceSunshine.
        </p>
      </div>
    </div>
  </body>
</html>
